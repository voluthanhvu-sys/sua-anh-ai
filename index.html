<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sửa Ảnh AI">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css">
<title>Sửa Ảnh AI</title>
</head>
<body>
<header>
  <button id="btnMenu" class="icon" aria-label="Các cuộc trò chuyện">☰</button>
  <h1 id="title">Sửa Ảnh AI</h1>
  <button id="btnNew" class="icon" aria-label="Cuộc trò chuyện mới">＋</button>
  <button id="btnSettings" class="icon" aria-label="Cài đặt">⚙︎</button>
</header>

<section id="locked" class="locked hidden">
  <h2>🔒 Ứng dụng riêng tư</h2>
  <p class="hint">Chỉ dùng được bằng link mời riêng. Hãy mở đúng link bạn được gửi, hoặc dán link đó vào đây:</p>
  <input id="unlockInput" type="text" autocomplete="off" placeholder="Dán link mời">
  <button id="btnUnlock" class="btn primary">Mở khoá</button>
  <p id="unlockMsg" class="hint"></p>
</section>

<main id="app">
  <div id="chat" class="chat"></div>
  <div id="welcome" class="welcome">
    <h2>Chào bạn 👋</h2>
    <p class="hint">Hỏi gì cũng được, hoặc gửi ảnh và nói muốn sửa thế nào.</p>
    <div id="suggest" class="chips"></div>
  </div>
</main>

<footer id="composer">
  <div id="attached" class="attached"></div>
  <div class="bar">
    <label class="icon attach" aria-label="Gửi ảnh">📎<input id="filePick" type="file" accept="image/*" multiple hidden></label>
    <textarea id="input" rows="1" placeholder="Nhắn tin hoặc mô tả cách sửa ảnh..."></textarea>
    <button id="btnSend" class="send" aria-label="Gửi">➤</button>
  </div>
</footer>

<aside id="drawer" class="drawer hidden">
  <div class="drawer-panel">
    <div class="row between"><h2>Trò chuyện</h2><button id="btnCloseDrawer" class="icon">✕</button></div>
    <button id="btnNew2" class="btn primary">＋ Cuộc trò chuyện mới</button>
    <div id="convList" class="conv-list"></div>
  </div>
</aside>

<div id="viewer" class="viewer hidden">
  <img id="viewImg" alt="">
  <div class="row">
    <button id="btnSave" class="btn primary">Lưu / Chia sẻ</button>
    <button id="btnUse" class="btn">Sửa tiếp ảnh này</button>
    <button id="btnCloseView" class="btn">Đóng</button>
  </div>
</div>

<dialog id="settings">
  <form method="dialog">
    <h2>Cài đặt</h2>
    <label>API key (chỉ lưu trên máy này)
      <input id="setKey" type="password" autocomplete="off" placeholder="key CheapAI">
    </label>
    <label>Địa chỉ API
      <input id="setBase" type="url">
    </label>
    <label>Model chat
      <input id="setChatModel" list="chatModels">
      <datalist id="chatModels">
        <option value="claude-sonnet-5"><option value="claude-sonnet-5-5"><option value="claude-haiku-4-5-20251001"><option value="gpt-6-sol"><option value="gemini-3.5-flash">
      </datalist>
    </label>
    <label>Model ảnh
      <input id="setModel" list="models">
      <datalist id="models">
        <option value="gpt-image-2.5"><option value="gpt-image-2"><option value="gpt-image-2.5-flare"><option value="gpt-image-2.5-sunburst">
      </datalist>
    </label>
    <label>Chất lượng khi sửa ảnh có sẵn
      <select id="setEditQuality">
        <option value="high">Cao (~$0.04, nét, nên dùng)</option>
        <option value="medium">Vừa (~$0.01)</option>
        <option value="low">Thấp (~$0.003, nhanh)</option>
      </select>
    </label>
    <label>Chất lượng khi tạo ảnh mới
      <select id="setQuality">
        <option value="medium">Vừa (~$0.01, nên dùng)</option>
        <option value="low">Thấp (~$0.003, nhanh)</option>
        <option value="high">Cao (~$0.04)</option>
        <option value="auto">Tự động (có thể đắt)</option>
      </select>
    </label>
    <label class="check"><input id="setFidelity" type="checkbox"> Giữ sát khuôn mặt / chi tiết gốc</label>
    <div class="row">
      <button value="cancel" class="btn">Huỷ</button>
      <button id="btnSaveSettings" value="ok" class="btn primary">Lưu</button>
    </div>
  </form>
</dialog>

<script src="app.js"></script>
</body>
</html>
